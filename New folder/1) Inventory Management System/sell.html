<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sell - Inventory Manager</title>
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/sell.css" />
  </head>
  <body>
    <div class="app">
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-brand">Inventory Manager</div>
        <nav>
          <button type="button" id="navDashboard" class="nav-link">
            Dashboard
          </button>
          <button type="button" id="navPurchase" class="nav-link">
            Purchase
          </button>
          <button type="button" id="navSell" class="nav-link active">
            Sell
          </button>
        </nav>
        <button type="button" id="logoutBtn" class="nav-link logout">
          Log out
        </button>
      </aside>

      <div id="sidebarOverlay" class="overlay"></div>

      <main class="main">
        <header class="topbar">
          <button type="button" id="menuToggle" class="menu-toggle">
            &#9776;
          </button>
          <h1>Sell</h1>
          <div class="user">Ali</div>
        </header>

        <div class="panel">
          <h3>New sale</h3>
          <form id="sellForm" class="form-grid">
            <div>
              <label for="sellCustomer">Customer name</label>
              <input
                type="text"
                id="sellCustomer"
                placeholder="Customer name"
              />
            </div>
            <div>
              <label for="sellProduct">Product (from purchases)</label>
              <select id="sellProduct">
                <option value="">Select product</option>
              </select>
            </div>
            <div>
              <label for="sellQty">Quantity</label>
              <input type="number" id="sellQty" placeholder="0" min="1" />
            </div>
            <div>
              <label for="sellPrice">Price</label>
              <input type="number" id="sellPrice" placeholder="0" min="1" />
            </div>
            <div class="full btn-group">
              <button type="button" id="sellClearBtn" class="btn btn-light">
                Clear
              </button>
              <button type="button" id="sellSaveBtn" class="btn btn-primary">
                Save sale
              </button>
            </div>
          </form>
        </div>

        <div class="panel">
          <h3>Recent sales</h3>
          <table>
            <thead>
              <tr>
                <th>Customer</th>
                <th>Product</th>
                <th>Qty</th>
                <th>Price</th>
                <th>Total Price</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="sellTableBody">
              <tr>
                <td colspan="6">No sales yet</td>
              </tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>

    <script type="module" src="js/sell.js"></script>
  </body>
</html>
